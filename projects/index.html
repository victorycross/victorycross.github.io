<html lang="en">
<head>

<title>Project Repository — BrightPath Technologies</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.10);
    --ink: #111827;
    --ink-secondary: #6b7280;
    --ink-tertiary: #9ca3af;
    --accent: #2563eb;
    --accent-light: rgba(37,99,235,0.08);
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; }

  /* ── Site header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 0 24px;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; height: 60px;
  }
  .header-logo { font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .header-logo span { font-weight: 400; color: var(--ink-secondary); font-size: 13px; margin-left: 6px; }
  .header-back { font-size: 13px; color: var(--ink-secondary); text-decoration: none; display: flex; align-items: center; gap: 4px; }
  .header-back:hover { color: var(--ink); }

  /* ── Login ── */
  #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 24px 24px; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .login-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-tertiary); margin-bottom: 28px;
  }
  .login-badge svg { width: 14px; height: 14px; flex-shrink: 0; }
  .login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .login-card .subtitle { font-size: 13px; color: var(--ink-secondary); margin-bottom: 24px; }
  .login-card .subtitle code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; background: #f3f4f6; padding: 2px 5px; border-radius: 4px;
  }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-secondary); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s; background: var(--surface);
  }
  input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .error-msg {
    font-size: 12px; color: #dc2626; background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 8px; padding: 10px 12px; margin-top: 12px; display: none;
  }
  .btn-primary {
    margin-top: 16px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; background: #111827; color: #fff;
    border: none; border-radius: 8px;
    font-size: 13px; font-weight: 500; font-family: var(--sans);
    cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: #374151; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary svg { width: 15px; height: 15px; }
  .login-hint { margin-top: 20px; font-size: 11px; color: var(--ink-tertiary); text-align: center; }
  .login-hint a { color: var(--ink-tertiary); }
  .login-hint a:hover { color: var(--ink-secondary); }

  /* ── Catalog view ── */
  #catalog-view { display: none; padding-top: 60px; }

  /* Top bar */
  .top-bar {
    position: sticky; top: 60px; z-index: 50;
    background: rgba(249,250,251,0.97); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .top-bar-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px; height: 52px;
  }
  .top-bar-left { display: flex; flex-direction: column; min-width: 180px; }
  .top-bar-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .top-bar-subtitle { font-size: 11px; color: var(--ink-tertiary); line-height: 1.2; }
  .top-bar-center { flex: 1; }
  .search-input {
    width: 100%; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: var(--sans); outline: none;
    background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.10); }
  .top-bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cat-select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; font-family: var(--sans); background: var(--surface);
    color: var(--ink); outline: none; cursor: pointer;
  }
  .cat-select:focus { border-color: var(--accent); }
  .signout-btn {
    font-size: 12px; color: var(--ink-tertiary); background: none;
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-family: var(--sans); padding: 6px 10px;
    transition: color 0.12s, border-color 0.12s;
  }
  .signout-btn:hover { color: var(--ink); border-color: rgba(0,0,0,0.2); }

  /* Gist status bar */
  .status-bar {
    background: #f3f4f6; border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .status-bar-inner {
    max-width: 1200px; margin: 0 auto;
    height: 28px; display: flex; align-items: center; gap: 6px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.synced { background: #22c55e; }
  .status-dot.pending { background: #f59e0b; }
  .status-dot.unsynced { background: var(--ink-tertiary); }
  .status-text { font-size: 11px; color: var(--ink-tertiary); }

  /* Table wrapper */
  .table-wrap {
    max-width: 1200px; margin: 0 auto;
    padding: 16px 24px 48px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    min-width: 760px;
  }

  /* Sticky table head */
  thead tr { position: sticky; top: 140px; z-index: 40; }
  th {
    background: var(--ink); color: #ffffff;
    font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0 10px; height: 36px; text-align: left; white-space: nowrap;
    cursor: pointer; user-select: none;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  th:last-child { border-right: none; }
  th:hover { background: #1f2937; }
  th.sorted-asc::after { content: ' ↑'; opacity: 0.7; }
  th.sorted-desc::after { content: ' ↓'; opacity: 0.7; }
  th.no-sort { cursor: default; }
  th.no-sort:hover { background: var(--ink); }

  /* Col widths */
  .col-dot   { width: 28px; text-align: center; padding: 0 6px; }
  .col-repo  { min-width: 180px; }
  .col-cat   { width: 130px; }
  .col-deploy { width: 180px; }
  .col-push  { width: 90px; }
  .col-vulns { width: 70px; text-align: center; }
  .col-notes { min-width: 180px; }

  tbody tr {
    height: 40px; border-bottom: 1px solid #f3f4f6;
    transition: background 0.08s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f9fafb; }
  tbody tr.hidden-row { display: none; }

  td {
    padding: 0 10px; font-size: 12px; color: var(--ink);
    vertical-align: middle;
  }
  td.col-dot { text-align: center; padding: 0 6px; }
  td.col-vulns { text-align: center; }

  /* Status dot */
  .status-circle {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-red    { background: #ef4444; }
  .dot-amber  { background: #f59e0b; }
  .dot-green  { background: #22c55e; }
  .dot-grey   { background: #d1d5db; }

  /* Repo cell */
  .repo-cell { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .repo-mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; color: var(--ink); white-space: nowrap; }
  .vis-badge {
    font-size: 9.5px; font-weight: 500; padding: 1px 5px; border-radius: 20px;
    letter-spacing: 0.02em; flex-shrink: 0;
  }
  .vis-public  { background: var(--accent-light); color: var(--accent); }
  .vis-private { background: #f3f4f6; color: var(--ink-secondary); }
  .gh-link {
    flex-shrink: 0; color: var(--ink-tertiary); text-decoration: none;
    display: flex; align-items: center; padding: 2px;
    border-radius: 4px; transition: color 0.12s;
  }
  .gh-link:hover { color: var(--ink); }
  .gh-link svg { width: 11px; height: 11px; }

  /* Category pill */
  .cat-pill {
    display: inline-block; font-size: 10.5px; font-weight: 500;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }

  /* Deploy cell */
  .deploy-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 500;
    padding: 2px 7px; border-radius: 20px;
    background: #f3f4f6; color: var(--ink-secondary); white-space: nowrap;
  }
  .deploy-link { text-decoration: none; }
  .deploy-link:hover .deploy-badge { background: #e5e7eb; color: var(--ink); }

  /* Last push */
  .push-cell { font-size: 11.5px; color: var(--ink-secondary); white-space: nowrap; }
  .push-loading { color: var(--ink-tertiary); font-style: italic; }

  /* Vulns */
  .vuln-ok  { font-size: 12px; color: #16a34a; font-weight: 500; }
  .vuln-bad { font-size: 12px; color: #dc2626; font-weight: 500; }
  .vuln-unk { font-size: 12px; color: var(--ink-tertiary); }

  /* Notes cell */
  .notes-wrap { position: relative; display: flex; align-items: flex-start; gap: 4px; }
  .notes-ta {
    width: 100%; min-width: 140px; max-width: 280px;
    padding: 4px 7px; border: 1px solid transparent;
    border-radius: 6px; font-size: 11.5px; font-family: var(--sans);
    color: var(--ink); background: transparent; resize: none;
    line-height: 1.45; rows: 2; overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
    outline: none;
  }
  .notes-ta:hover { border-color: var(--border); background: var(--surface); }
  .notes-ta:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 2px rgba(37,99,235,0.10); }
  .notes-status {
    font-size: 10px; color: var(--ink-tertiary); white-space: nowrap;
    padding-top: 5px; flex-shrink: 0; min-width: 44px; text-align: right;
  }
  .notes-status.saving { color: #f59e0b; }
  .notes-status.saved  { color: #16a34a; }

  /* Empty state */
  .empty-row td { text-align: center; padding: 32px; color: var(--ink-tertiary); font-size: 13px; }
</style>
</head>

    personal:   { label: 'Personal',             color: '#dcfce7', text: '#166534' },
    apps:       { label: 'Apps & Tools',         color: '#ffedd5', text: '#9a3412' },
    ofr:        { label: 'OFR / Professional',   color: '#e0f2fe', text: '#0369a1' },
    internal:   { label: 'Internal',             color: '#f3f4f6', text: '#374151' },
  }

  var CAT_ORDER = ['brightpath', 'ai', 'risk', 'personal', 'apps', 'ofr', 'internal']

  /* ── State ── */
  var notes = {}           // { repoName: text }
  var gistId = null
  var pushDates = {}       // { repoName: ISOstring }
  var sortCol = 'cat'      // default sort
  var sortDir = 1          // 1 = asc, -1 = desc
  var filterSearch = ''
  var filterCat = ''
  var noteTimers = {}      // debounce timers per repo
  var GIST_FILENAME = 'repo-notes.json'
  var GIST_DESC = 'BrightPath catalog notes'

  /* ── Auth ── */
  function getToken () { return sessionStorage.getItem('gh_token') }
  function saveToken (t) { sessionStorage.setItem('gh_token', t) }
  function clearToken () { sessionStorage.removeItem('gh_token') }

  function authHeaders () {
    return { Authorization: 'token ' + getToken(), Accept: 'application/vnd.github.v3+json' }
  }

  /* ── Login form ── */
  function showError (msg) {
    var el = document.getElementById('error-msg')
    el.textContent = msg
    el.style.display = msg ? 'block' : 'none'
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault()
    var input = document.getElementById('token-input')
    var token = input.value.trim()
    var btn = document.getElementById('login-btn')
    if (!token) return
    btn.disabled = true
    showError('')
    fetch('https://api.github.com/user', { headers: { Authorization: 'token ' + token } })
      .then(function (res) {
        if (!res.ok) { showError('Invalid token \u2014 check it and try again.'); btn.disabled = false; return null }
        return res.json()
      })
      .then(function (user) {
        if (!user) return
        if (user.login !== 'victorycross') { showError('Unauthorised \u2014 this page is restricted.'); btn.disabled = false; return }
        saveToken(token)
        initCatalog()
      })
      .catch(function () { showError('Could not reach GitHub \u2014 check your connection.'); btn.disabled = false })
  })

  document.getElementById('signout-btn').addEventListener('click', function () {
    clearToken()
    location.reload()
  })

  /* ── Relative time ── */
  function relTime (iso) {
    if (!iso) return '\u2014'
    var diff = Date.now() - new Date(iso).getTime()
    var mins = Math.floor(diff / 60000)
    if (mins < 1) return 'just now'
    if (mins < 60) return mins + 'm ago'
    var hrs = Math.floor(mins / 60)
    if (hrs < 24) return hrs + 'h ago'
    var days = Math.floor(hrs / 24)
    if (days < 30) return days + 'd ago'
    var mos = Math.floor(days / 30)
    if (mos < 12) return mos + 'mo ago'
    return Math.floor(mos / 12) + 'y ago'
  }

  /* ── Status dot logic ── */
  function dotClass (repo) {
    if (repo.vulns > 0) return 'dot-red'
    if (repo.vulns === null) return 'dot-amber'
    if (repo.deploy && repo.vulns === 0) return 'dot-green'
    return 'dot-grey'
  }

  /* ── Sort value per column ── */
  function sortVal (repo, col) {
    if (col === 'dot')    return dotClass(repo)
    if (col === 'name')   return repo.name.toLowerCase()
    if (col === 'cat')    return CAT_ORDER.indexOf(repo.cat) + '|' + repo.name.toLowerCase()
    if (col === 'deploy') return repo.deploy ? repo.deploy.host : ''
    if (col === 'push')   return pushDates[repo.name] || ''
    if (col === 'vulns')  return repo.vulns === null ? 999 : repo.vulns
    return ''
  }

  /* ── Gist status UI ── */
  function setGistStatus (state, msg) {
    var dot = document.getElementById('gist-dot')
    var txt = document.getElementById('gist-status-text')
    dot.className = 'status-dot ' + state
    txt.textContent = msg
  }

  /* ── Gist: load notes ── */
  function loadGistNotes () {
    setGistStatus('pending', 'Loading notes\u2026')
    var stored = localStorage.getItem('bp_catalog_gist_id')
    if (stored) {
      gistId = stored
      fetchGist(gistId)
    } else {
      searchGists()
    }
  }

  function fetchGist (id) {
    fetch('https://api.github.com/gists/' + id, { headers: authHeaders() })
      .then(function (r) {
        if (r.status === 404) { gistId = null; localStorage.removeItem('bp_catalog_gist_id'); searchGists(); return null }
        if (!r.ok) { setGistStatus('unsynced', 'Could not load notes'); return null }
        return r.json()
      })
      .then(function (data) {
        if (!data) return
        var file = data.files && data.files[GIST_FILENAME]
        if (file && file.content) {
          try { notes = JSON.parse(file.content) } catch (e) { notes = {} }
        }
        populateNotes()
        setGistStatus('synced', 'Notes synced \u00b7 gist ID: ' + id)
      })
      .catch(function () { setGistStatus('unsynced', 'Could not reach GitHub for notes') })
  }

  function searchGists () {
    fetch('https://api.github.com/gists?per_page=100', { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : [] })
      .then(function (list) {
        var found = null
        for (var i = 0; i < list.length; i++) {
          if (list[i].description === GIST_DESC) { found = list[i]; break }
        }
        if (found) {
          gistId = found.id
          localStorage.setItem('bp_catalog_gist_id', gistId)
          fetchGist(gistId)
        } else {
          setGistStatus('unsynced', 'Notes not yet saved')
        }
      })
      .catch(function () { setGistStatus('unsynced', 'Notes not yet saved') })
  }

  function populateNotes () {
    REPOS.forEach(function (repo) {
      var ta = document.getElementById('note-' + repo.name)
      if (ta && notes[repo.name]) {
        ta.value = notes[repo.name]
        autoGrowTa(ta)
      }
    })
  }

  /* ── Gist: save notes ── */
  function saveNotes (repoName) {
    var statusEl = document.getElementById('note-status-' + repoName)
    if (statusEl) { statusEl.textContent = 'saving\u2026'; statusEl.className = 'notes-status saving' }

    var payload = JSON.stringify({ description: GIST_DESC, public: false, files: {} })
    var filesObj = {}
    filesObj[GIST_FILENAME] = { content: JSON.stringify(notes, null, 2) }
    var body = JSON.stringify({ description: GIST_DESC, public: false, files: filesObj })

    var url, method
    if (gistId) {
      url = 'https://api.github.com/gists/' + gistId
      method = 'PATCH'
    } else {
      url = 'https://api.github.com/gists'
      method = 'POST'
    }

    fetch(url, { method: method, headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: body })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status) })
      .then(function (data) {
        if (!gistId) {
          gistId = data.id
          localStorage.setItem('bp_catalog_gist_id', gistId)
        }
        if (statusEl) { statusEl.textContent = 'saved \u2713'; statusEl.className = 'notes-status saved' }
        setGistStatus('synced', 'Notes synced \u00b7 gist ID: ' + gistId)
        setTimeout(function () { if (statusEl) { statusEl.textContent = ''; statusEl.className = 'notes-status' } }, 2500)
      })
      .catch(function () {
        if (statusEl) { statusEl.textContent = 'error'; statusEl.className = 'notes-status' }
      })
  }

  /* ── Auto-grow textarea ── */
  function autoGrowTa (ta) {
    ta.style.height = 'auto'
    ta.style.height = ta.scrollHeight + 'px'
  }

  /* ── Build table head ── */
  var COLUMNS = [
    { key: 'dot',    label: '\u00b7',       cls: 'col-dot',    noSort: true },
    { key: 'name',   label: 'Repository',   cls: 'col-repo',   noSort: false },
    { key: 'cat',    label: 'Category',     cls: 'col-cat',    noSort: false },
    { key: 'deploy', label: 'Deployed',     cls: 'col-deploy', noSort: false },
    { key: 'push',   label: 'Last Push',    cls: 'col-push',   noSort: false },
    { key: 'vulns',  label: 'Vulns',        cls: 'col-vulns',  noSort: false },
    { key: 'notes',  label: 'Notes',        cls: 'col-notes',  noSort: true  },
  ]

  function buildHead () {
    var tr = document.getElementById('table-head-row')
    COLUMNS.forEach(function (col) {
      var th = document.createElement('th')
      th.className = col.cls + (col.noSort ? ' no-sort' : '')
      th.textContent = col.label
      if (!col.noSort) {
        th.addEventListener('click', function () {
          if (sortCol === col.key) {
            sortDir = -sortDir
          } else {
            sortCol = col.key
            sortDir = 1
          }
          renderRows()
          updateSortIndicators()
        })
      }
      th.dataset.colKey = col.key
      tr.appendChild(th)
    })
  }

  function updateSortIndicators () {
    var ths = document.querySelectorAll('#table-head-row th')
    ths.forEach(function (th) {
      th.classList.remove('sorted-asc', 'sorted-desc')
      if (th.dataset.colKey === sortCol) {
        th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc')
      }
    })
  }

  /* ── Build a single table row ── */
  function buildRow (repo) {
    var tr = document.createElement('tr')
    tr.dataset.name = repo.name
    tr.dataset.cat = repo.cat
    tr.dataset.desc = repo.desc.toLowerCase()

    // Col 1: status dot
    var tdDot = document.createElement('td')
    tdDot.className = 'col-dot'
    var dot = document.createElement('span')
    dot.className = 'status-circle ' + dotClass(repo)
    tdDot.appendChild(dot)
    tr.appendChild(tdDot)

    // Col 2: repository
    var tdRepo = document.createElement('td')
    tdRepo.className = 'col-repo'
    var repoCell = document.createElement('div')
    repoCell.className = 'repo-cell'

    var mono = document.createElement('span')
    mono.className = 'repo-mono'
    mono.textContent = repo.name

    var visBadge = document.createElement('span')
    visBadge.className = 'vis-badge vis-' + repo.vis
    visBadge.textContent = repo.vis

    var ghLink = document.createElement('a')
    ghLink.className = 'gh-link'
    ghLink.href = 'https://github.com/victorycross/' + repo.name
    ghLink.target = '_blank'
    ghLink.rel = 'noopener'
    ghLink.title = 'Open on GitHub'
    var extSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    extSvg.setAttribute('viewBox', '0 0 16 16')
    extSvg.setAttribute('fill', 'currentColor')
    var extPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    extPath.setAttribute('d', 'M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z')
    extSvg.appendChild(extPath)
    ghLink.appendChild(extSvg)

    repoCell.appendChild(mono)
    repoCell.appendChild(visBadge)
    repoCell.appendChild(ghLink)
    tdRepo.appendChild(repoCell)
    tr.appendChild(tdRepo)

    // Col 3: category
    var tdCat = document.createElement('td')
    tdCat.className = 'col-cat'
    var catMeta = CATS[repo.cat]
    if (catMeta) {
      var pill = document.createElement('span')
      pill.className = 'cat-pill'
      pill.style.background = catMeta.color
      pill.style.color = catMeta.text
      pill.textContent = catMeta.label
      tdCat.appendChild(pill)
    }
    tr.appendChild(tdCat)

    // Col 4: deployed
    var tdDeploy = document.createElement('td')
    tdDeploy.className = 'col-deploy'
    if (repo.deploy) {
      var deployAnchor = document.createElement('a')
      deployAnchor.className = 'deploy-link'
      deployAnchor.href = repo.deploy.url
      deployAnchor.target = '_blank'
      deployAnchor.rel = 'noopener'
      var deployBadge = document.createElement('span')
      deployBadge.className = 'deploy-badge'
      // host icon placeholder (text only)
      deployBadge.textContent = repo.deploy.host
      deployAnchor.appendChild(deployBadge)
      tdDeploy.appendChild(deployAnchor)
    } else {
      var dash = document.createElement('span')
      dash.style.color = 'var(--ink-tertiary)'
      dash.textContent = '\u2014'
      tdDeploy.appendChild(dash)
    }
    tr.appendChild(tdDeploy)

    // Col 5: last push
    var tdPush = document.createElement('td')
    tdPush.className = 'col-push'
    var pushSpan = document.createElement('span')
    pushSpan.className = 'push-cell push-loading'
    pushSpan.textContent = '\u2026'
    pushSpan.id = 'push-' + repo.name
    tdPush.appendChild(pushSpan)
    tr.appendChild(tdPush)

    // Col 6: vulns
    var tdVulns = document.createElement('td')
    tdVulns.className = 'col-vulns'
    var vulnSpan = document.createElement('span')
    if (repo.vulns === null) {
      vulnSpan.className = 'vuln-unk'
      vulnSpan.textContent = '?'
    } else if (repo.vulns === 0) {
      vulnSpan.className = 'vuln-ok'
      vulnSpan.textContent = '\u2713 0'
    } else {
      vulnSpan.className = 'vuln-bad'
      vulnSpan.textContent = '\u26a0 ' + repo.vulns
    }
    tdVulns.appendChild(vulnSpan)
    tr.appendChild(tdVulns)

    // Col 7: notes
    var tdNotes = document.createElement('td')
    tdNotes.className = 'col-notes'
    var notesWrap = document.createElement('div')
    notesWrap.className = 'notes-wrap'

    var ta = document.createElement('textarea')
    ta.className = 'notes-ta'
    ta.id = 'note-' + repo.name
    ta.rows = 2
    ta.placeholder = 'Add notes\u2026'
    ta.spellcheck = false

    var noteStatus = document.createElement('span')
    noteStatus.className = 'notes-status'
    noteStatus.id = 'note-status-' + repo.name

    ta.addEventListener('input', function () {
      autoGrowTa(ta)
      notes[repo.name] = ta.value
      if (noteTimers[repo.name]) clearTimeout(noteTimers[repo.name])
      noteTimers[repo.name] = setTimeout(function () { saveNotes(repo.name) }, 1500)
    })

    notesWrap.appendChild(ta)
    notesWrap.appendChild(noteStatus)
    tdNotes.appendChild(notesWrap)
    tr.appendChild(tdNotes)

    return tr
  }

  /* ── Render / re-render rows ── */
  function renderRows () {
    var tbody = document.getElementById('table-body')

    // sort a copy
    var sorted = REPOS.slice().sort(function (a, b) {
      var av = sortVal(a, sortCol)
      var bv = sortVal(b, sortCol)
      if (av < bv) return -sortDir
      if (av > bv) return sortDir
      return 0
    })

    // clear existing rows (preserve textareas by detaching)
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild)

    var anyVisible = false
    sorted.forEach(function (repo) {
      var tr = buildRow(repo)
      // restore note content
      var ta = tr.querySelector('textarea')
      if (ta && notes[repo.name]) { ta.value = notes[repo.name]; autoGrowTa(ta) }
      // restore push date
      var pushEl = tr.querySelector('#push-' + repo.name)
      if (pushEl && pushDates[repo.name]) {
        pushEl.textContent = relTime(pushDates[repo.name])
        pushEl.classList.remove('push-loading')
      }
      // filter
      var nameMatch = repo.name.toLowerCase().indexOf(filterSearch) !== -1
      var descMatch = repo.desc.toLowerCase().indexOf(filterSearch) !== -1
      var catMatch  = !filterCat || repo.cat === filterCat
      if ((!filterSearch || nameMatch || descMatch) && catMatch) {
        anyVisible = true
      } else {
        tr.classList.add('hidden-row')
      }
      tbody.appendChild(tr)
    })

    // empty state
    var existingEmpty = document.getElementById('empty-row')
    if (existingEmpty) existingEmpty.parentNode.removeChild(existingEmpty)
    if (!anyVisible) {
      var emptyTr = document.createElement('tr')
      emptyTr.id = 'empty-row'
      emptyTr.className = 'empty-row'
      var emptyTd = document.createElement('td')
      emptyTd.colSpan = COLUMNS.length
      emptyTd.textContent = 'No repositories match your search.'
      emptyTr.appendChild(emptyTd)
      tbody.appendChild(emptyTr)
    }
  }

  /* ── Populate category filter dropdown ── */
  function buildCatFilter () {
    var sel = document.getElementById('cat-filter')
    CAT_ORDER.forEach(function (catKey) {
      var opt = document.createElement('option')
      opt.value = catKey
      opt.textContent = CATS[catKey].label
      sel.appendChild(opt)
    })
    sel.addEventListener('change', function () {
      filterCat = sel.value
      renderRows()
    })
  }

  /* ── Fetch push dates ── */
  function fetchPushDates () {
    fetch('https://api.github.com/users/victorycross/repos?per_page=100&type=owner', { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : [] })
      .then(function (list) {
        list.forEach(function (r) {
          if (r.pushed_at) pushDates[r.name] = r.pushed_at
        })
        // update visible cells
        REPOS.forEach(function (repo) {
          var el = document.getElementById('push-' + repo.name)
          if (el) {
            if (pushDates[repo.name]) {
              el.textContent = relTime(pushDates[repo.name])
              el.classList.remove('push-loading')
            } else {
              el.textContent = '\u2014'
              el.classList.remove('push-loading')
            }
          }
        })
      })
      .catch(function () {
        REPOS.forEach(function (repo) {
          var el = document.getElementById('push-' + repo.name)
          if (el) { el.textContent = '\u2014'; el.classList.remove('push-loading') }
        })
      })
  }

  /* ── Search ── */
  document.getElementById('search-input').addEventListener('input', function () {
    filterSearch = this.value.trim().toLowerCase()
    renderRows()
  })

  /* ── Init catalog after auth ── */
  function initCatalog () {
    document.getElementById('login-view').style.display = 'none'
    document.getElementById('catalog-view').style.display = 'block'

    // Repo count label
    document.getElementById('repo-count-label').textContent = REPOS.length + ' active repos'

    buildHead()
    buildCatFilter()
    renderRows()
    updateSortIndicators()
    loadGistNotes()
    fetchPushDates()
  }

  /* ── Bootstrap ── */
  var stored = getToken()
  if (stored) {
    fetch('https://api.github.com/user', { headers: { Authorization: 'token ' + stored } })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (user) {
        if (user && user.login === 'victorycross') { initCatalog() }
        else { clearToken() }
      })
      .catch(function () { clearToken() })
  }

})()
</script>
</body>
</html>
